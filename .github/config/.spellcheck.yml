matrix:
- name: Spanish
  aspell:
    lang: es
    ignore-case: true
    mode: markdown
  dictionary:
    wordlists:
    - .github/config/.wordlist.txt
    encoding: utf-8
  sources:
  - '0?_*.md'
  default_encoding: utf-8
- name: English
  aspell:
    lang: en
    ignore-case: true
    mode: markdown
  dictionary:
    wordlists:
    - .github/config/.wordlist.txt
    encoding: utf-8
  sources:
  - '1?_*.md'
  default_encoding: utf-8
