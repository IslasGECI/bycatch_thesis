name: Render report
on:
  push:
    branches:
      'develop'
jobs:
  build-image:
    name: Build Docker image 🐋
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and export
      uses: docker/build-push-action@v5
      with:
        context: .
        tags: islasgeci/bycatch_thesis:latest
        outputs: type=docker,dest=/tmp/image.tar
    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: image
        path: /tmp/image.tar
        retention-days: 14

  render-report-albatross:
    name: Render albatross results and draft
    needs: [build-image]
    runs-on: ubuntu-latest
    env:
      BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
      BITBUCKET_PASSWORD: ${{ secrets.BITBUCKET_PASSWORD }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Download artifact
      uses: actions/download-artifact@main
      with:
        name: image
        path: /tmp
    - name: Load image
      run: |
        docker load --input /tmp/image.tar
        docker image ls -a
    - name: 🌎🦢 Generate albatross results draft
      run: |
        docker run --volume $PWD:/workdir --env BITBUCKET_USERNAME=$BITBUCKET_USERNAME --env BITBUCKET_PASSWORD=$BITBUCKET_PASSWORD islasgeci/bycatch_thesis:latest make reports/articulo_uno.pdf
    - name: ⏫🏛️ Upload draft
      uses: actions/upload-artifact@main
      with:
        name: albatross_results
        path: |
          reports/*.pdf
          reports/*.docx
          data/processed/*.csv
          reports/figures/*.png
        retention-days: 14

  render-report-fisheries:
    name: Render fisheries results and draft
    needs: [build-image]
    runs-on: ubuntu-latest
    env:
      BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
      BITBUCKET_PASSWORD: ${{ secrets.BITBUCKET_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Download artifact
      uses: actions/download-artifact@main
      with:
        name: image
        path: /tmp
    - name: Load image
      run: |
        docker load --input /tmp/image.tar
        docker image ls -a
    - name: 🐋🔏 Docker log-in
      run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
    - name: Copy vessel data
      run: docker pull islasgeci/vessel_data:latest
    - run: docker run --name vessel_data islasgeci/vessel_data:latest
    - run: docker cp vessel_data:/data/. data/external
    - name: 🌎🛥️ Generate fisheries results
      run: |
        docker run --volume $PWD:/workdir --env BITBUCKET_USERNAME=$BITBUCKET_USERNAME --env BITBUCKET_PASSWORD=$BITBUCKET_PASSWORD islasgeci/bycatch_thesis:latest make results_fisheries
    - name: ⏫🏛️ Upload draft
      uses: actions/upload-artifact@main
      with:
        name: fisheries_results
        path: |
          reports/*.pdf
          reports/*.docx
          data/processed/*.csv
          reports/figures/*.png
        retention-days: 14

  update-docker:
    name: Push image to Docker Hub
    needs: [render-report-albatross, render-report-fisheries]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Docker log-in
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
    - name: Download artifact
      uses: actions/download-artifact@main
      with:
        name: image
        path: /tmp
    - name: Load image
      run: |
        docker load --input /tmp/image.tar
        docker image ls -a
    - name: Push latest Docker image to Docker Hub
      run: docker push islasgeci/bycatch_thesis:latest
    - name: Push SHA tag to Docker Hub
      run: |
        docker tag islasgeci/bycatch_thesis:latest islasgeci/bycatch_thesis:${GITHUB_SHA:0:4}
        docker push islasgeci/bycatch_thesis:${GITHUB_SHA:0:4}

  cleanup-artifacts:
    name: Delete temporary artifacts 🧹
    if: always()
    needs: [update-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Delete Docker image artifact
        uses: geekyeggo/delete-artifact@main
        with:
          name: image
