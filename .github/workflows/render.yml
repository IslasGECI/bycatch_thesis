name: Render one job
on: push
jobs:

  render-report:
    name: Render results and draft
    runs-on: ubuntu-latest
    env:
      BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
      BITBUCKET_PASSWORD: ${{ secrets.BITBUCKET_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: 🏗️🐋 Build image
      run: docker build --tag islasgeci/bycatch_thesis:latest .
    - name: 🌎 Generate trip results
      run: |
        docker run --volume $PWD:/workdir --env BITBUCKET_USERNAME=$BITBUCKET_USERNAME --env BITBUCKET_PASSWORD=$BITBUCKET_PASSWORD islasgeci/bycatch_thesis make results
    - name: ✍🏼 Build draft
      run: |
        docker run -v $PWD:/workdir islasgeci/bycatch_thesis:latest make all
    - name: 🐋🔏 Docker log-in
      run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
    - name: 🐋⏫ Push latest Docker image to Docker Hub
      run: docker push islasgeci/bycatch_thesis:latest
    - name: Push SHA tag to Docker Hub
      run: |
        docker tag islasgeci/bycatch_thesis:latest islasgeci/bycatch_thesis:${GITHUB_SHA:0:4}
        docker push islasgeci/bycatch_thesis:${GITHUB_SHA:0:4}
    - name: ⏫🏛️ Upload draft
      uses: actions/upload-artifact@main
      with:
        name: reports
        path: |
          reports/*.pdf
          reports/*.docx
          data/processed/*.csv
          reports/figures/*.png
