name: Render papers
on:
  schedule:
    - cron: '0 7 * * 3'
  workflow_dispatch:
jobs:
  build-image:
    name: Build Docker image, generate papers, and upload results
    runs-on: ubuntu-latest
    env:
      BITBUCKET_PASSWORD: ${{ secrets.BITBUCKET_PASSWORD }}
      BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master
    - name: Build and export
      uses: docker/build-push-action@master
      with:
        context: .
        tags: islasgeci/bycatch_thesis:latest
    - name: 🐋🔏 Docker log-in
      run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
    - name: Copy vessel data
      run: docker pull islasgeci/vessel_data:latest
    - run: docker run --name vessel_data islasgeci/vessel_data:latest
    - run: docker cp vessel_data:/data/. data/external
    - name: 🌎🦆🎣🛥️ Generate papers
      run: |
        docker run --volume $PWD:/workdir --env BITBUCKET_USERNAME=$BITBUCKET_USERNAME --env BITBUCKET_PASSWORD=$BITBUCKET_PASSWORD islasgeci/bycatch_thesis:latest make all
    - name: ⏫🏛️ Upload draft
      uses: actions/upload-artifact@main
      with:
        name: paper_results
        path: |
          data/processed/*.csv
          reports/*.docx
          reports/*.pdf
          reports/figures/*.png
        retention-days: 14
    - name: Push latest Docker image to Docker Hub
      run: docker push islasgeci/bycatch_thesis:latest
    - name: Push four-digit week tag to Docker Hub
      run: |
        four_digit_week=$(date +%y%V)
        docker tag islasgeci/bycatch_thesis:latest islasgeci/bycatch_thesis:${four_digit_week}
        docker push islasgeci/bycatch_thesis:${four_digit_week}
