name: Check spelling and style
on:
  push:
    branches:
      'develop'
jobs:

  spellcheck_es:
    name: Check spelling in Spanish
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: rojopolis/spellcheck-github-actions@master
      name: Spellcheck
      with:
        config_path: .github/config/.spellcheck.yml
        task_name: markdown-in-spanish

  spellcheck_en:
    name: Check spelling in English
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: rojopolis/spellcheck-github-actions@master
      name: Spellcheck
      with:
        config_path: .github/config/.spellcheck.yml
        task_name: markdown-in-english

  sentence_length:
    name: Check sentence length
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Line ends with a period
      run: |
        for file in 1?_*.md
        do
            echo $file
            echo $(egrep -v ":$" $file | egrep -v "\.$" | egrep -v "\?$" | egrep -v "^1\. " | egrep -v "^\W" ) > lines_without_period.tmp
            cat lines_without_period.tmp
            [[ $(cat lines_without_period.tmp | wc -w) -eq 0 ]]
        done
    - name: Sentences are short
      run: |
        for file in 1?_*.md
        do
            echo $file
            IFS=$'\n' && for line in $(egrep ":$" $file);    do echo "$line" ; [[ $(echo "$line" | wc -w) -le 25 ]] ; done
            IFS=$'\n' && for line in $(egrep "\.$" $file);   do echo "$line" ; [[ $(echo "$line" | wc -w) -le 25 ]] ; done
            IFS=$'\n' && for line in $(egrep "\?$" $file);   do echo "$line" ; [[ $(echo "$line" | wc -w) -le 25 ]] ; done
            IFS=$'\n' && for line in $(egrep "^1\. " $file); do echo "$line" ; [[ $(echo "$line" | wc -w) -le 25 ]] ; done
            IFS=$'\n' && for line in $(egrep "^\W" $file);   do echo "$line" ; [[ $(echo "$line" | wc -w) -le 25 ]] ; done
        done

  paragraph_length:
    name: Check paragraph length
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Paragraphs are short
      run: |
        for file in 1?_*.md
        do
            echo "$file"
            awk '
              BEGIN {
                RS = "";
                max = 200;
                fail = 0;
              }
              {
                words = NF;
                if (words > max) {
                  split($0, lines, "\n");
                  printf "❌ Paragraph %d too long (%d words)\n→ %s\n\n",
                         NR, words, lines[1];
                  fail = 1;
                }
              }
              END {
                if (fail) exit 1;
              }
            ' "$file"
        done
