name: Check style
on: push
jobs:

  spellcheck:
    name: Check spelling
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: rojopolis/spellcheck-github-actions@master
      name: Spellcheck
      with:
        config_path: .github/config/.spellcheck.yml
        task_name: Markdown

  sentence_length:
    name: Check sentence length
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Line ends with a period
      run: |
        cat ??.md > draft.md
        echo $(egrep -v "\.$" draft.md | egrep -v "^\W" | egrep -v ":$" | egrep -v "^1\. ") > lines_without_period.tmp
        cat lines_without_period.tmp
        [[ $(cat lines_without_period.tmp | wc -w) -eq 0 ]]
    - name: Sentences are short
      run: |
        cat ??.md > draft.md
        IFS=$'\n' && for line in $(egrep "\.$" draft.md);   do echo "$line" ; [[ $(echo "$line" | wc -w) -le 25 ]] ; done
        IFS=$'\n' && for line in $(egrep "^\W" draft.md);   do echo "$line" ; [[ $(echo "$line" | wc -w) -le 25 ]] ; done
        IFS=$'\n' && for line in $(egrep ":$" draft.md);    do echo "$line" ; [[ $(echo "$line" | wc -w) -le 25 ]] ; done
        IFS=$'\n' && for line in $(egrep "^1\. " draft.md); do echo "$line" ; [[ $(echo "$line" | wc -w) -le 25 ]] ; done

  paragraph_length:
    name: Check paragraph length
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Paragraphs are short
      run: |
        cat ??.md > draft.md
        awk -v RS= '{print "Párrafo " NR ": " NF " palabras"}' draft.md
    - name: Paragraphs are short
      run: for file in ??.md ; do awk -v RS= '{print "Párrafo " NR ": " NF " palabras"}' $file
